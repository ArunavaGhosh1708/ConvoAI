version: "3.9"

# Full-stack integration test environment.
# Usage:
#   docker-compose -f docker-compose.test.yml up -d
#   docker-compose -f docker-compose.test.yml run --rm test-runner
#   docker-compose -f docker-compose.test.yml down -v

services:
  # ── Infrastructure ────────────────────────────────────────────────────────
  postgres-test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER:     convoai
      POSTGRES_PASSWORD: convoai
      POSTGRES_DB:       convoai_test
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U convoai -d convoai_test"]
      interval: 5s
      retries:  10

  redis-test:
    image: redis:7-alpine
    healthcheck:
      test:    ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # ── API under test ────────────────────────────────────────────────────────
  api-test:
    build:
      context:    ./backend
      dockerfile: Dockerfile
    env_file: .env.test
    environment:
      DATABASE_URL: postgresql+asyncpg://convoai:convoai@postgres-test:5432/convoai_test
      REDIS_URL:    redis://redis-test:6379/0
      APP_ENV:      test
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test:     ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      retries:  12
      start_period: 30s

  # ── Integration test runner ───────────────────────────────────────────────
  test-runner:
    build:
      context:    ./backend
      dockerfile: Dockerfile
    env_file: .env.test
    environment:
      DATABASE_URL: postgresql+asyncpg://convoai:convoai@postgres-test:5432/convoai_test
      REDIS_URL:    redis://redis-test:6379/0
      API_BASE_URL: http://api-test:8000
      APP_ENV:      test
    depends_on:
      api-test:
        condition: service_healthy
    command: >
      python -m pytest tests/integration/ -v --tb=short
    profiles:
      - integration
