apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: convoai-worker
  labels:
    cloud.googleapis.com/location: us-central1
annotations:
  run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/vpc-access-connector: projects/PROJECT_ID/locations/us-central1/connectors/convoai-vpc-connector
        run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      containerConcurrency: 1
      timeoutSeconds: 600
      serviceAccountName: convoai-worker-sa@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: us-central1-docker.pkg.dev/PROJECT_ID/convoai/api:latest
          command: ["celery"]
          args: ["-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
          env:
            - name: APP_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: convoai-database-url
                  key: latest
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: convoai-redis-url
                  key: latest
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: convoai-openai-api-key
                  key: latest
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: convoai-celery-broker-url
                  key: latest
